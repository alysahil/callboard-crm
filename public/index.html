<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callboard - Sales Lead & Cold Calling CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F3F5F7;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --surface-3: #E3E7EC;
    --border: #DBE0E6;
    --text: #1B2027;
    --text-muted: #5B6472;
    --text-dim: #939CA8;
    --amber: #B8720F;
    --amber-dim: rgba(184, 114, 15, 0.12);
    --green: #218A57;
    --green-dim: rgba(33, 138, 87, 0.10);
    --red: #C6433E;
    --red-dim: rgba(198, 67, 62, 0.10);
    --blue: #2E71A8;
    --blue-dim: rgba(46, 113, 168, 0.10);
    --purple: #7C3AED;
    --purple-dim: rgba(124, 58, 237, 0.10);
    --gray: #7A8390;
    --gray-dim: rgba(122, 131, 144, 0.12);
  }
  #callboard-root {
    --bg: #F3F5F7;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --surface-3: #E3E7EC;
    --border: #DBE0E6;
    --text: #1B2027;
    --text-muted: #5B6472;
    --text-dim: #939CA8;
    --amber: #B8720F;
    --amber-dim: rgba(184, 114, 15, 0.12);
    --green: #218A57;
    --green-dim: rgba(33, 138, 87, 0.10);
    --red: #C6433E;
    --red-dim: rgba(198, 67, 62, 0.10);
    --blue: #2E71A8;
    --blue-dim: rgba(46, 113, 168, 0.10);
    --purple: #7C3AED;
    --purple-dim: rgba(124, 58, 237, 0.10);
    --gray: #7A8390;
    --gray-dim: rgba(122, 131, 144, 0.12);

    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
    box-sizing: border-box;
  }
  #callboard-root * { box-sizing: border-box; }
  #callboard-root .mono { font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace; }
  #callboard-root button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  #callboard-root input, #callboard-root select, #callboard-root textarea {
    font-family: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }
  #callboard-root input:focus, #callboard-root select:focus, #callboard-root textarea:focus { border-color: var(--amber); }
  #callboard-root ::-webkit-scrollbar { width: 8px; height: 8px; }
  #callboard-root ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
  #callboard-root ::-webkit-scrollbar-track { background: transparent; }

  /* Header */
  #cb-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  #cb-logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  #cb-logo .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 3px var(--amber-dim);
  }
  #cb-search { flex: 1; max-width: 340px; }
  #cb-search input { width: 100%; }
  .cb-stats-strip {
    display: flex;
    gap: 16px;
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
  }
  .cb-stats-strip b { color: var(--text); font-family: inherit; }
  .cb-header-actions { display: flex; gap: 8px; align-items: center; }
  .cb-btn {
    padding: 7px 13px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2);
    transition: background 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .cb-btn:hover { background: var(--surface-3); }
  .cb-btn-primary { background: var(--amber); color: #FFFFFF; border-color: var(--amber); }
  .cb-btn-primary:hover { background: #A0650D; }
  .cb-btn-ghost { border-color: transparent; color: var(--text-muted); }
  .cb-btn-ghost:hover { color: var(--text); background: var(--surface-2); }
  .cb-btn-sm { padding: 4px 8px; font-size: 11.5px; }

  .cb-db-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px;
    border-radius: 100px; font-size: 11px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .cb-db-badge.connected { background: var(--green-dim); color: var(--green); border-color: rgba(33, 138, 87, 0.3); }
  .cb-db-badge.offline { background: var(--amber-dim); color: var(--amber); border-color: rgba(184, 114, 15, 0.3); }

  /* Body layout */
  #cb-body { flex: 1; display: flex; min-height: 0; position: relative; }

  /* Sidebar */
  #cb-sidebar {
    width: 250px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px 10px;
  }
  .cb-sidebar-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    padding: 8px 8px 4px;
    font-weight: 700;
  }
  .cb-filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 2px;
    font-size: 13px;
  }
  .cb-filter-row:hover { background: var(--surface-2); }
  .cb-filter-row.active { background: var(--amber-dim); color: var(--amber); font-weight: 600; }
  .cb-filter-row .cb-frow-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .cb-filter-row .cb-frow-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cb-filter-row .cb-frow-count { font-size: 11.5px; color: var(--text-dim); font-family: "SF Mono", ui-monospace, monospace; flex-shrink: 0; }
  .cb-filter-row.active .cb-frow-count { color: var(--amber); }
  .cb-signal { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cb-niche-bar { height: 3px; border-radius: 2px; background: var(--surface-3); margin: 0 8px 6px; overflow: hidden; }
  .cb-niche-bar-fill { height: 100%; background: var(--amber); }

  /* Main */
  #cb-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; }
  #cb-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  #cb-toolbar .cb-toolbar-title { font-weight: 700; font-size: 15px; }
  #cb-toolbar .cb-toolbar-sub { color: var(--text-muted); font-size: 12.5px; }
  .cb-status-chip {
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
  }
  .cb-status-chip.active { background: var(--amber); color: #FFFFFF; border-color: var(--amber); }

  #cb-table-wrap { flex: 1; overflow-y: auto; }
  table#cb-table { width: 100%; border-collapse: collapse; }
  #cb-table thead th {
    position: sticky; top: 0;
    background: var(--bg);
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    z-index: 1;
  }
  #cb-table tbody tr { cursor: pointer; border-bottom: 1px solid var(--surface-2); transition: background 0.1s; }
  #cb-table tbody tr:hover { background: var(--surface); }
  #cb-table tbody tr.selected { background: var(--surface-2); }
  #cb-table td { padding: 9px 12px; vertical-align: middle; }
  .cb-name-cell { font-weight: 600; }
  .cb-company-cell { color: var(--text-muted); font-size: 12.5px; }
  .cb-niche-tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--surface-3); color: var(--text-muted); white-space: nowrap; }
  .cb-location-tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--blue-dim); color: var(--blue); white-space: nowrap; }
  .cb-new-tag { display: inline-block; font-size: 9.5px; font-weight: 800; padding: 2px 5px; border-radius: 4px; background: var(--green); color: #FFF; text-transform: uppercase; letter-spacing: 0.5px; }
  .cb-tag-pill { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 100px; background: var(--purple-dim); color: var(--purple); font-weight: 600; margin-right: 3px; }

  .cb-website-link { display: inline-flex; align-items: center; gap: 4px; color: var(--blue); text-decoration: none; font-size: 12px; font-weight: 500; }
  .cb-website-link:hover { text-decoration: underline; }

  .cb-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 100px; }
  .cb-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); gap: 10px; padding: 40px; text-align: center; }
  .cb-empty b { color: var(--text-muted); font-size: 15px; font-weight: 700; }

  /* Drawer */
  #cb-drawer {
    width: 400px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: none;
    flex-direction: column;
    overflow-y: auto;
  }
  #cb-drawer.open { display: flex; }
  .cb-drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .cb-drawer-head .cb-dh-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .cb-drawer-name { font-size: 17px; font-weight: 700; }
  .cb-drawer-sub { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
  .cb-drawer-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .cb-drawer-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); font-weight: 700; margin-bottom: 8px; }
  .cb-field-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 7px; color: var(--text); }
  .cb-field-row .cb-field-ico { width: 16px; color: var(--text-dim); flex-shrink: 0; text-align: center; }
  .cb-select-full { width: 100%; }
  .cb-log-item { padding: 9px 10px; background: var(--surface-2); border-radius: 8px; margin-bottom: 7px; font-size: 12.5px; }
  .cb-log-item .cb-log-top { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .cb-log-item .cb-log-date { color: var(--text-dim); font-family: "SF Mono", ui-monospace, monospace; font-size: 11px; }
  .cb-log-item .cb-log-note { color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
  #cb-drawer textarea { width: 100%; resize: vertical; min-height: 55px; margin-top: 6px; }
  .cb-drawer-close { color: var(--text-dim); font-size: 18px; padding: 2px 6px; border-radius: 5px; }
  .cb-drawer-close:hover { background: var(--surface-2); color: var(--text); }

  /* Bulk action bar */
  #cb-bulk-bar {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #1B2027; color: #FFFFFF; border-radius: 10px;
    padding: 10px 18px; display: none; align-items: center; gap: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 40; font-size: 13px;
  }
  #cb-bulk-bar.open { display: flex; }
  #cb-bulk-bar .cb-btn { background: #2A303C; color: #FFF; border-color: #3A4250; }
  #cb-bulk-bar .cb-btn:hover { background: #3A4250; }

  /* Modals */
  .cb-modal-overlay-style {
    position: fixed; inset: 0; background: rgba(27,32,39,0.45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .cb-modal-overlay-style.open { display: flex; }
  .cb-modal-card {
    width: 560px; max-height: 85vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; box-shadow: 0 12px 32px rgba(0,0,0,0.15);
  }
  .cb-modal-card h3 { margin: 0 0 4px; font-size: 16.5px; }
  .cb-modal-card .cb-modal-sub { color: var(--text-muted); font-size: 12.5px; margin-bottom: 16px; }
  .cb-map-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .cb-map-row label { width: 110px; flex-shrink: 0; font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
  .cb-map-row select { flex: 1; }
  #cb-drop-zone {
    border: 1.5px dashed var(--border); border-radius: 10px;
    padding: 28px; text-align: center; color: var(--text-muted);
    font-size: 13px; cursor: pointer; margin-bottom: 14px; transition: border-color 0.15s;
  }
  #cb-drop-zone:hover { border-color: var(--amber); color: var(--text); }
  #cb-drop-zone.dragover { border-color: var(--amber); background: var(--amber-dim); }

  .cb-toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #1B2027; color: #FFF; border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 200;
    opacity: 0; transform: translateY(10px); transition: opacity 0.2s, transform 0.2s; pointer-events: none;
  }
  .cb-toast.show { opacity: 1; transform: translateY(0); }

  @keyframes cb-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184,114,15,0.45); }
    50% { box-shadow: 0 0 0 4px rgba(184,114,15,0); }
  }
  .cb-signal.pulse { animation: cb-pulse 1.6s infinite; }

  /* Login screen */
  #cb-login-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  }
  #cb-login-screen.hidden { display: none; }
  .cb-login-card { width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 26px; }
  .cb-login-logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; margin-bottom: 4px; color: var(--text); }
  .cb-login-logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px var(--amber-dim); }
  .cb-login-sub { color: var(--text-muted); font-size: 12.5px; margin-bottom: 20px; }
  .cb-login-field { margin-bottom: 12px; }
  .cb-login-field label { display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
  .cb-login-field input { width: 100%; }
  .cb-login-error { color: var(--red); font-size: 12px; margin-bottom: 10px; min-height: 0; }
  .cb-login-toggle { text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--text-muted); }
  .cb-login-toggle a { color: var(--amber); cursor: pointer; font-weight: 600; text-decoration: none; }

  /* User badge + admin */
  #cb-user-badge { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 100px; background: var(--surface-2); font-size: 12.5px; white-space: nowrap; }
  #cb-user-badge .cb-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--amber); color: #fff; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #cb-user-badge .cb-role-tag { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); font-weight: 700; }
  .cb-admin-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .cb-admin-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 700; }
  .cb-admin-table td { padding: 8px; border-bottom: 1px solid var(--surface-2); font-size: 12.5px; vertical-align: middle; }
  .cb-role-pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 100px; background: var(--amber-dim); color: var(--amber); text-transform: uppercase; }
  .cb-role-pill.caller { background: var(--blue-dim); color: var(--blue); }
  .cb-inline-btn { font-size: 11.5px; padding: 4px 8px; border-radius: 5px; background: var(--surface-2); margin-right: 4px; }
  .cb-inline-btn:hover { background: var(--surface-3); }
  .cb-admin-tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .cb-admin-tab { padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .cb-admin-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
  .cb-activity-item { padding: 8px 0; border-bottom: 1px solid var(--surface-2); font-size: 12.5px; }
  .cb-activity-item .cb-act-meta { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  .cb-dupe-item { background: var(--surface-2); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12.5px; }
  .cb-dupe-item b { color: var(--text); }
</style>
</head>
<body>

<div id="cb-login-screen">
  <div class="cb-login-card" id="cb-login-card"></div>
</div>

<div id="callboard-root">
  <div id="cb-header">
    <div id="cb-logo"><span class="dot"></span>Callboard</div>
    <div id="cb-search"><input id="cb-search-input" placeholder="Search name, company, phone, country, state..." /></div>
    <div class="cb-stats-strip" id="cb-stats-strip"></div>
    <div class="cb-header-actions">
      <div id="cb-db-status-badge" class="cb-db-badge offline" title="Click to configure Supabase DB">⚡ Offline Mode</div>
      <button class="cb-btn cb-btn-ghost" id="cb-export-btn">Export</button>
      <button class="cb-btn cb-btn-primary" id="cb-import-btn">Import</button>
      <button class="cb-btn cb-btn-ghost" id="cb-admin-btn" style="display:none;">Admin</button>
      <div id="cb-user-badge"></div>
    </div>
  </div>

  <div id="cb-body">
    <div id="cb-sidebar">
      <div class="cb-sidebar-label">Queue</div>
      <div id="cb-queue-list"></div>

      <div class="cb-sidebar-label" style="margin-top:12px;">Country</div>
      <div id="cb-country-list"></div>

      <div class="cb-sidebar-label" style="margin-top:12px;">State</div>
      <div id="cb-state-list"></div>

      <div class="cb-sidebar-label" style="margin-top:12px;">Niches / Industries</div>
      <div id="cb-niche-list"></div>

      <div class="cb-sidebar-label" style="margin-top:12px;">Tags</div>
      <div id="cb-tag-list"></div>
    </div>

    <div id="cb-main">
      <div id="cb-toolbar">
        <div>
          <div class="cb-toolbar-title" id="cb-toolbar-title">All Contacts</div>
          <div class="cb-toolbar-sub" id="cb-toolbar-sub"></div>
        </div>

        <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
          <select id="cb-sort-select" style="font-size:12.5px; padding:5px 8px;">
            <option value="name">Sort by Name</option>
            <option value="company">Sort by Company</option>
            <option value="niche">Sort by Niche</option>
            <option value="country">Sort by Country</option>
            <option value="state">Sort by State</option>
            <option value="created_desc" selected>Newest First</option>
            <option value="created_asc">Oldest First</option>
          </select>
          <div style="display:flex; gap:5px;" id="cb-status-filters"></div>
        </div>
      </div>

      <div id="cb-table-wrap"></div>

      <!-- Bulk Action Bar -->
      <div id="cb-bulk-bar">
        <span id="cb-bulk-count">0 selected</span>
        <button class="cb-btn" id="cb-bulk-tag-btn">🏷 Add Tag</button>
        <button class="cb-btn" id="cb-bulk-status-btn">🔄 Change Status</button>
        <button class="cb-btn" id="cb-bulk-export-btn">📥 Export Selected</button>
        <button class="cb-btn" id="cb-bulk-delete-btn" style="color:var(--red);">🗑 Delete Selected</button>
        <button class="cb-btn cb-btn-ghost" id="cb-bulk-clear-btn" style="color:#AAA;">Cancel</button>
      </div>
    </div>

    <div id="cb-drawer"></div>
  </div>
</div>

<!-- Modal Overlays -->
<div id="cb-modal-overlay" class="cb-modal-overlay-style"><div class="cb-modal-card" id="cb-modal"></div></div>
<div id="cb-admin-overlay" class="cb-modal-overlay-style"><div class="cb-modal-card" id="cb-admin-modal"></div></div>
<div id="cb-db-overlay" class="cb-modal-overlay-style"><div class="cb-modal-card" id="cb-db-modal"></div></div>

<div class="cb-toast" id="cb-toast"></div>

<script>
(function() {
  const STATUS_META = {
    new:           { label: "New",           color: "var(--gray)",  dim: "var(--gray-dim)"  },
    attempted:     { label: "Attempted",     color: "var(--amber)", dim: "var(--amber-dim)" },

    { step: 1, label: "Cold Call",        channel: "Call",     delayDays: 0 },
    { step: 2, label: "Follow-up Email",  channel: "Email",    delayDays: 0 },
    { step: 3, label: "LinkedIn Connect", channel: "LinkedIn", delayDays: 0 },

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function uid() { return 'c_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function fmtDate(d) {
    if (!d) return "—";
    const dt = new Date(d + "T00:00:00");
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtDateTime(iso) {
    if (!iso) return "—";
    const dt = new Date(iso);
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  function isNewLead(c) {
    if (!c.createdAt) return false;
    const diff = Date.now() - new Date(c.createdAt).getTime();
    return diff < (7 * 24 * 60 * 60 * 1000); // 7 days
  }
  function sequenceProgress(c) {
    const touches = c.calls || [];
    const done = Math.min(touches.length, SEQUENCE_TEMPLATE.length);
    const next = SEQUENCE_TEMPLATE[done] || null;
    const lastTouchDate = touches.length ? new Date(touches[touches.length - 1].date) : new Date();
    let suggestedDate = null;
    if (next) {
      const d = new Date(lastTouchDate);
      d.setDate(d.getDate() + next.delayDays);
      suggestedDate = d.toISOString().slice(0, 10);
    }
    return { done, next, suggestedDate };
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toast(msg) {
    const t = $('#cb-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);

  // ---------- Supabase & Storage Layer ----------

      const saved = localStorage.getItem('cb_supabase_config');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.supabaseUrl = parsed.url || '';
        state.supabaseKey = parsed.key || '';

  function saveSupabaseConfig(url, key) {

    state.supabaseKey = key;

  async function initSupabaseClient() {
    if (state.supabaseUrl && state.supabaseKey && window.supabase) {
      try {
        state.supabaseClient = window.supabase.createClient(state.supabaseUrl, state.supabaseKey);
        state.dbConnected = true;

        await loadData();
      } catch (e) {

    } else {

  function updateDbStatusBadge() {

    if (!b) return;

      b.innerHTML = '⚡ Supabase DB Connected';
    } else {
      b.className = 'cb-db-badge offline';
      b.innerHTML = '⚙ Local Storage (Set DB)';
    }
  }

  function formatWebsiteUrl(urlStr) {
    if (!urlStr) return null;
    let str = String(urlStr).trim();
    if (!str) return null;

    // 1. If it contains a domain (e.g. example.com, www.example.com, https://domain.com)
    const domainMatch = str.match(/(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?::\d+)?(?:\/[^\s]*)?/i);
    if (domainMatch) {
      let clean = domainMatch[0].trim();
      if (!/^https?:\/\//i.test(clean)) clean = 'https://' + clean;
      return clean;
    }

    // 2. If it's a category/title string without domain (e.g. "ladies suits /#792857 - Tanishicrafts")
    const parts = str.split(/[-/#]/).map(p => p.trim()).filter(Boolean);
    const keyword = parts[parts.length - 1] || str;
    return 'https://www.google.com/search?q=' + encodeURIComponent(keyword);
  }

  function getDisplayWebsite(urlStr) {
    if (!urlStr) return '—';
    let str = String(urlStr).trim();
    if (!str) return '—';

    const domainMatch = str.match(/(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}/i);
    if (domainMatch) {
      return domainMatch[0].replace(/^https?:\/\//i, '').replace(/^www\./i, '');
    }

    const parts = str.split(/[-/#]/).map(p => p.trim()).filter(Boolean);
    return parts[parts.length - 1] || str;
  }

  async function loadData() {
    if (state.supabaseClient) {
      try {
        const { data, error } = await state.supabaseClient.from('contacts').select('*');
        if (!error && data) {
          state.contacts = data;
          render();
          return;
        }
      } catch (e) {}
    }
    // Fallback to localStorage / window.storage
    try {
      if (typeof window.storage !== 'undefined' && window.storage) {
        const res = await window.storage.get('contacts-data', true);
        if (res && res.value) state.contacts = JSON.parse(res.value);
      } else {
        const local = localStorage.getItem('contacts-data');
        if (local) state.contacts = JSON.parse(local);
      }
    } catch(e) { state.contacts = []; }
    render();
  }

  let saveTimer = null;
  function saveData() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      // Sync to local
      try {
        if (typeof window.storage !== 'undefined' && window.storage) {
          await window.storage.set('contacts-data', JSON.stringify(state.contacts), true);
        }
        localStorage.setItem('contacts-data', JSON.stringify(state.contacts));
      } catch(e) {}

      // Sync to Supabase if connected
      if (state.supabaseClient) {
        try {
          await state.supabaseClient.from('contacts').upsert(state.contacts, { onConflict: 'id' });
        } catch(e) {}
      }
    }, 300);
  }

  async function loadUsers() {
    try {
      const local = localStorage.getItem('cb-users');
      if (local) state.users = JSON.parse(local);
    } catch(e) { state.users = []; }
  }
  async function saveUsers() {
    try { localStorage.setItem('cb-users', JSON.stringify(state.users)); } catch(e) {}
  }
  async function loadActivityLog() {
    try {
      const local = localStorage.getItem('cb-activity-log');
      if (local) state.activityLog = JSON.parse(local);
    } catch(e) { state.activityLog = []; }
  }
  async function saveActivityLog() {
    try { localStorage.setItem('cb-activity-log', JSON.stringify(state.activityLog)); } catch(e) {}
  }
  function addActivity(action, detail) {
    state.activityLog.unshift({
      id: uid(),
      ts: new Date().toISOString(),
      userName: state.currentUser ? state.currentUser.name : 'Unknown',
      action, detail: detail || ''
    });
    if (state.activityLog.length > 300) state.activityLog = state.activityLog.slice(0, 300);
    saveActivityLog();
  }

  async function checkSession() {
    try {
      const sess = localStorage.getItem('cb-session');
      if (sess) {
        const session = JSON.parse(sess);
        const user = state.users.find(u => u.id === session.userId && u.active);
        if (user) { state.currentUser = { id: user.id, name: user.name, role: user.role }; return true; }
      }
    } catch (e) {}
    return false;
  }
  async function saveSession(userId) {
    try { localStorage.setItem('cb-session', JSON.stringify({ userId })); } catch (e) {}
  }
  async function clearSession() {
    try { localStorage.removeItem('cb-session'); } catch (e) {}
  }

  function attemptLogin(name, pin) {
    const match = state.users.find(u => u.name.toLowerCase() === name.trim().toLowerCase() && u.pin === pin);
    if (!match) return { ok: false, error: 'No match for that name and PIN.' };
    if (!match.active) return { ok: false, error: 'This account has been deactivated. Ask an admin.' };
    return { ok: true, user: match };
  }
  async function registerUser(name, pin) {
    const trimmed = name.trim();
    if (!trimmed || pin.length < 4) return { ok: false, error: 'Enter a name and a PIN of at least 4 digits.' };
    if (state.users.find(u => u.name.toLowerCase() === trimmed.toLowerCase())) {
      return { ok: false, error: 'That name is already registered — log in instead.' };
    }
    const isFirstUser = state.users.length === 0;
    const user = { id: uid(), name: trimmed, pin, role: isFirstUser ? 'admin' : 'caller', active: true, createdAt: new Date().toISOString() };
    state.users.push(user);
    await saveUsers();
    return { ok: true, user };
  }
  async function completeLogin(user) {
    state.currentUser = { id: user.id, name: user.name, role: user.role };
    await saveSession(user.id);
    addActivity('Logged in', '');
    await loadData();
  }
  async function logout() {
    addActivity('Logged out', '');
    await clearSession();
    state.currentUser = null;
    state.selectedId = null;
    render();
  }

  // ---------- Derived lists ----------
  function nicheList() {
    const map = {};
    state.contacts.forEach(c => { const n = c.niche || "Uncategorized"; map[n] = (map[n] || 0) + 1; });
    return Object.keys(map).sort((a, b) => map[b] - map[a]).map(n => ({ name: n, count: map[n] }));
  }
  function countryList() {
    const map = {};
    state.contacts.forEach(c => { if (c.country) map[c.country] = (map[c.country] || 0) + 1; });
    return Object.keys(map).sort((a, b) => map[b] - map[a]).map(k => ({ name: k, count: map[k] }));
  }
  function stateList() {
    const map = {};
    state.contacts.forEach(c => { if (c.state) map[c.state] = (map[c.state] || 0) + 1; });
    return Object.keys(map).sort((a, b) => map[b] - map[a]).map(k => ({ name: k, count: map[k] }));
  }
  function tagList() {
    const map = {};
    state.contacts.forEach(c => { (c.tags || []).forEach(t => map[t] = (map[t] || 0) + 1); });
    return Object.keys(map).sort((a, b) => map[b] - map[a]).map(k => ({ name: k, count: map[k] }));
  }

  function nicheContactedRatio(niche) {
    const list = state.contacts.filter(c => (c.niche || "Uncategorized") === niche);
    if (!list.length) return 0;
    return list.filter(c => c.status !== 'new').length / list.length;
  }
  function isOverdue(c) { return c.nextFollowUp && c.nextFollowUp < todayStr() && c.status !== 'converted' && c.status !== 'do_not_call'; }
  function isDueToday(c) { return c.nextFollowUp === todayStr() && c.status !== 'converted' && c.status !== 'do_not_call'; }

  function signalColorFor(c) {
    if (c.status === 'do_not_call') return 'var(--gray)';
    if (isOverdue(c)) return 'var(--red)';
    if (isDueToday(c)) return 'var(--amber)';
    if (c.status === 'converted' || c.status === 'interested') return 'var(--green)';
    if (c.status === 'connected') return 'var(--blue)';
    return 'var(--gray)';
  }

  function filteredContacts() {
    let list = state.contacts.slice();
    if (state.nicheFilter) list = list.filter(c => (c.niche || "Uncategorized") === state.nicheFilter);
    if (state.countryFilter) list = list.filter(c => c.country === state.countryFilter);
    if (state.stateFilter) list = list.filter(c => c.state === state.stateFilter);
    if (state.tagFilter) list = list.filter(c => (c.tags || []).includes(state.tagFilter));

    if (state.queueFilter === 'due_today') list = list.filter(isDueToday);
    if (state.queueFilter === 'overdue') list = list.filter(isOverdue);
    if (state.queueFilter === 'new') list = list.filter(c => c.status === 'new');
    if (state.queueFilter === 'new_leads') list = list.filter(isNewLead);
    if (state.statusFilter) list = list.filter(c => c.status === state.statusFilter);

    if (state.search.trim()) {
      const q = state.search.trim().toLowerCase();
      list = list.filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.company || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q) ||
        (c.email || '').toLowerCase().includes(q) ||
        (c.country || '').toLowerCase().includes(q) ||
        (c.state || '').toLowerCase().includes(q) ||
        (c.niche || '').toLowerCase().includes(q)
      );
    }

    // Sorting
    list.sort((a, b) => {
      if (state.sortBy === 'name') return (a.name || '').localeCompare(b.name || '');
      if (state.sortBy === 'company') return (a.company || '').localeCompare(b.company || '');
      if (state.sortBy === 'niche') return (a.niche || '').localeCompare(b.niche || '');
      if (state.sortBy === 'country') return (a.country || '').localeCompare(b.country || '');
      if (state.sortBy === 'state') return (a.state || '').localeCompare(b.state || '');
      if (state.sortBy === 'created_asc') return (a.createdAt || '').localeCompare(b.createdAt || '');
      // default: created_desc
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });

    return list;
  }

  // ---------- Duplicate Detection ----------
  function checkDuplicates(newRows) {
    const duplicates = [];
    const phoneMap = new Map();
    const emailMap = new Map();
    const nameMap = new Map();

    state.contacts.forEach(c => {
      if (c.phone) phoneMap.set(c.phone.replace(/\D/g, ''), c);
      if (c.email) emailMap.set(c.email.toLowerCase().trim(), c);
      if (c.name) nameMap.set((c.name + '|' + (c.company||'')).toLowerCase().trim(), c);
    });

    newRows.forEach((row) => {
      const p = row.phone ? row.phone.replace(/\D/g, '') : '';
      const e = row.email ? row.email.toLowerCase().trim() : '';
      const key = (row.name + '|' + (row.company||'')).toLowerCase().trim();

      let match = null;
      let reason = '';
      if (p && phoneMap.has(p)) { match = phoneMap.get(p); reason = 'Matching Phone: ' + row.phone; }
      else if (e && emailMap.has(e)) { match = emailMap.get(e); reason = 'Matching Email: ' + row.email; }
      else if (key && nameMap.has(key)) { match = nameMap.get(key); reason = 'Matching Name & Company: ' + row.name; }

      if (match) {
        duplicates.push({ newRow: row, existingRow: match, reason });
      }
    });

    return duplicates;
  }

  function renderLoginScreen() {
    $('#cb-login-screen').classList.remove('hidden');
    const card = $('#cb-login-card');
    const isRegister = state.loginMode === 'register';
    card.innerHTML = `
      <div class="cb-login-logo"><span class="dot"></span>Callboard</div>
      <div class="cb-login-sub">${isRegister ? (state.users.length === 0 ? 'Create the first admin account.' : 'Create your account for the workspace.') : 'Log in to Callboard.'}</div>
      <div class="cb-login-error" id="cb-login-error"></div>
      <div class="cb-login-field">
        <label>Your Name</label>
        <input id="cb-login-name" placeholder="e.g. Rahul Sharma" autocomplete="off" />
      </div>
      <div class="cb-login-field">
        <label>PIN ${isRegister ? '(4+ digits)' : ''}</label>
        <input id="cb-login-pin" type="password" inputmode="numeric" placeholder="••••" autocomplete="off" />
      </div>
      <button class="cb-btn cb-btn-primary" id="cb-login-submit" style="width:100%;">${isRegister ? 'Create Account' : 'Log In'}</button>
      <div class="cb-login-toggle">
        ${isRegister ? `Already have an account? <a id="cb-login-swap">Log in</a>` : `New user? <a id="cb-login-swap">Create account</a>`}
      </div>
    `;
    $('#cb-login-swap').addEventListener('click', () => { state.loginMode = isRegister ? 'login' : 'register'; render(); });
    const submit = async () => {
      const name = $('#cb-login-name').value;
      const pin = $('#cb-login-pin').value.trim();
      const errEl = $('#cb-login-error');
      errEl.textContent = '';
      if (isRegister) {
        const result = await registerUser(name, pin);
        if (!result.ok) { errEl.textContent = result.error; return; }
        await completeLogin(result.user);
        toast(`Welcome, ${result.user.name}`);
        render();
      } else {
        if (!name.trim() || !pin) { errEl.textContent = 'Enter name and PIN.'; return; }
        const result = attemptLogin(name, pin);
        if (!result.ok) { errEl.textContent = result.error; return; }
        await completeLogin(result.user);
        render();
      }
    };
    $('#cb-login-submit').addEventListener('click', submit);
    $('#cb-login-pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  }

  function renderSidebar() {
    const dueToday = state.contacts.filter(isDueToday).length;
    const overdue = state.contacts.filter(isOverdue).length;
    const newCount = state.contacts.filter(c => c.status === 'new').length;
    const new7dCount = state.contacts.filter(isNewLead).length;

    const queueRows = [
      { key: null, label: 'All Contacts', count: state.contacts.length, color: 'var(--gray)' },
      { key: 'new_leads', label: '✨ New Leads (7d)', count: new7dCount, color: 'var(--green)' },
      { key: 'overdue', label: 'Overdue', count: overdue, color: 'var(--red)' },
      { key: 'due_today', label: 'Due Today', count: dueToday, color: 'var(--amber)' },
      { key: 'new', label: 'Not Yet Called', count: newCount, color: 'var(--gray)' },
    ];
    $('#cb-queue-list').innerHTML = queueRows.map(r => `
      <div class="cb-filter-row ${state.queueFilter === r.key && !state.nicheFilter && !state.countryFilter && !state.stateFilter && !state.tagFilter ? 'active' : ''}" data-queue="${r.key || ''}">
        <div class="cb-frow-left">
          <span class="cb-signal ${r.key==='overdue' && r.count>0 ? 'pulse':''}" style="background:${r.color}"></span>
          <span class="cb-frow-name">${r.label}</span>
        </div>
        <span class="cb-frow-count">${r.count}</span>
      </div>
    `).join('');

    // Countries
    const countries = countryList();
    $('#cb-country-list').innerHTML = countries.length ? countries.map(c => `
      <div class="cb-filter-row ${state.countryFilter === c.name ? 'active' : ''}" data-country="${escapeHtml(c.name)}">
        <div class="cb-frow-left"><span class="cb-frow-name">🌐 ${escapeHtml(c.name)}</span></div>
        <span class="cb-frow-count">${c.count}</span>
      </div>
    `).join('') : `<div style="padding:4px 8px; color:var(--text-dim); font-size:12px;">No country specified</div>`;

    // States
    const states = stateList();
    $('#cb-state-list').innerHTML = states.length ? states.map(s => `
      <div class="cb-filter-row ${state.stateFilter === s.name ? 'active' : ''}" data-state="${escapeHtml(s.name)}">
        <div class="cb-frow-left"><span class="cb-frow-name">📍 ${escapeHtml(s.name)}</span></div>
        <span class="cb-frow-count">${s.count}</span>
      </div>
    `).join('') : `<div style="padding:4px 8px; color:var(--text-dim); font-size:12px;">No state specified</div>`;

    // Niches
    const niches = nicheList();
    $('#cb-niche-list').innerHTML = niches.length ? niches.map(n => {
      const ratio = nicheContactedRatio(n.name);
      return `
      <div class="cb-filter-row ${state.nicheFilter === n.name ? 'active' : ''}" data-niche="${escapeHtml(n.name)}">
        <div class="cb-frow-left"><span class="cb-frow-name">${escapeHtml(n.name)}</span></div>
        <span class="cb-frow-count">${n.count}</span>
      </div>
      <div class="cb-niche-bar"><div class="cb-niche-bar-fill" style="width:${Math.round(ratio*100)}%"></div></div>
      `;
    }).join('') : `<div style="padding:4px 8px; color:var(--text-dim); font-size:12px;">No niches</div>`;

    // Tags
    const tags = tagList();
    $('#cb-tag-list').innerHTML = tags.length ? tags.map(t => `
      <div class="cb-filter-row ${state.tagFilter === t.name ? 'active' : ''}" data-tag="${escapeHtml(t.name)}">
        <div class="cb-frow-left"><span class="cb-frow-name">🏷 ${escapeHtml(t.name)}</span></div>

    // Click handlers
    $$('#cb-queue-list [data-queue]').forEach(el => el.addEventListener('click', () => { resetFilters(); state.queueFilter = el.dataset.queue || null; render(); }));
    $$('#cb-country-list [data-country]').forEach(el => el.addEventListener('click', () => { resetFilters(); state.countryFilter = state.countryFilter === el.dataset.country ? null : el.dataset.country; render(); }));
    $$('#cb-state-list [data-state]').forEach(el => el.addEventListener('click', () => { resetFilters(); state.stateFilter = state.stateFilter === el.dataset.state ? null : el.dataset.state; render(); }));
    $$('#cb-niche-list [data-niche]').forEach(el => el.addEventListener('click', () => { resetFilters(); state.nicheFilter = state.nicheFilter === el.dataset.niche ? null : el.dataset.niche; render(); }));
    $$('#cb-tag-list [data-tag]').forEach(el => el.addEventListener('click', () => { resetFilters(); state.tagFilter = state.tagFilter === el.dataset.tag ? null : el.dataset.tag; render(); }));
  }

  function resetFilters() {
    state.nicheFilter = null;
    state.countryFilter = null;
    state.stateFilter = null;
    state.tagFilter = null;
    state.queueFilter = null;
  }

  function renderToolbar() {
    let title = 'All Contacts';
    if (state.nicheFilter) title = `Niche: ${state.nicheFilter}`;
    else if (state.countryFilter) title = `Country: ${state.countryFilter}`;
    else if (state.stateFilter) title = `State: ${state.stateFilter}`;
    else if (state.tagFilter) title = `Tag: ${state.tagFilter}`;
    else if (state.queueFilter === 'overdue') title = 'Overdue Follow-ups';
    else if (state.queueFilter === 'due_today') title = 'Due Today';
    else if (state.queueFilter === 'new') title = 'Not Yet Called';
    else if (state.queueFilter === 'new_leads') title = '✨ New Leads (Last 7 Days)';

    $('#cb-toolbar-title').textContent = title;
    const list = filteredContacts();
    $('#cb-toolbar-sub').textContent = `${list.length} contact${list.length === 1 ? '' : 's'}`;

    const statuses = Object.keys(STATUS_META);
    $('#cb-status-filters').innerHTML = statuses.map(s => `
      <button class="cb-status-chip ${state.statusFilter === s ? 'active' : ''}" data-status="${s}">${STATUS_META[s].label}</button>

    $$('#cb-status-filters [data-status]').forEach(el => el.addEventListener('click', () => {
      state.statusFilter = state.statusFilter === el.dataset.status ? null : el.dataset.status;

    }));

    $('#cb-sort-select').value = state.sortBy;

      </div>`;

      <table id="cb-table">

          <th>Website</th>

        <tbody>

    $('#cb-select-all').addEventListener('change', (e) => {

  function renderBulkBar() {
    const bar = $('#cb-bulk-bar');
    const cnt = state.selectedIds.size;
    if (cnt > 0) {
      bar.classList.add('open');
      $('#cb-bulk-count').textContent = `${cnt} lead${cnt > 1 ? 's' : ''} selected`;

      bar.classList.remove('open');
    }
  }

  $('#cb-bulk-tag-btn').addEventListener('click', () => {
    const tag = prompt('Enter tag name to add to selected leads:');
    if (!tag || !tag.trim()) return;
    const trimmed = tag.trim();
    state.contacts.forEach(c => {
      if (state.selectedIds.has(c.id)) {
        c.tags = c.tags || [];
        if (!c.tags.includes(trimmed)) c.tags.push(trimmed);
      }
    });
    saveData();
    toast(`Added tag "${trimmed}" to ${state.selectedIds.size} leads`);
    state.selectedIds.clear();
    render();
  });
  $('#cb-bulk-status-btn').addEventListener('click', () => {
    const statusKeys = Object.keys(STATUS_META).join(', ');
    const s = prompt(`Enter new status (${statusKeys}):`);
    if (!s || !STATUS_META[s.toLowerCase().trim()]) { if (s !== null) toast('Invalid status'); return; }
    const key = s.toLowerCase().trim();
    state.contacts.forEach(c => { if (state.selectedIds.has(c.id)) c.status = key; });

    state.selectedIds.clear();
    render();

  $('#cb-bulk-delete-btn').addEventListener('click', () => {

  });
  $('#cb-bulk-export-btn').addEventListener('click', () => {

      <div class="cb-drawer-head">

      </div>

        <div class="cb-field-row"><span class="cb-field-ico">📍</span><span>${escapeHtml([c.state, c.country].filter(Boolean).join(', ') || 'No location specified')}</span></div>

        <div class="cb-field-row" style="margin-top:6px;"><span class="cb-field-ico">🏷</span><div>${(c.tags||[]).map(t => `<span class="cb-tag-pill">${escapeHtml(t)}</span>`).join('') || 'None'}</div></div>
      </div>
      <div class="cb-drawer-section">
        <div class="cb-drawer-label">Follow-up Sequence</div>

      <div class="cb-drawer-section">

        <div class="cb-field-row">
          <select class="cb-select-full" id="cb-status-select">

        <div class="cb-drawer-label">Log a Touch</div>
        <div class="cb-field-row">
          <select class="cb-select-full" id="cb-channel-select">
            ${CHANNEL_OPTIONS.map(ch => `<option value="${ch}">${CHANNEL_ICON[ch]} ${ch}</option>`).join('')}
          </select>
        </div>
        <select class="cb-select-full" id="cb-outcome-select"></select>
        <textarea id="cb-call-notes" placeholder="Notes from interaction..."></textarea>
        <button class="cb-btn cb-btn-primary" id="cb-log-call-btn" style="width:100%; margin-top:8px;">Log Touch</button>
      </div>
      <div class="cb-drawer-section" style="flex:1;">
        <div class="cb-drawer-label">Touch History (${calls.length})</div>
        ${calls.length ? calls.map(l => `

              <span style="font-weight:700;">${CHANNEL_ICON[l.channel || 'Call'] || '☎'} ${escapeHtml(l.outcome)}</span>
              <span class="cb-log-date">${fmtDateTime(l.date)}</span>

            ${l.notes ? `<div class="cb-log-note">${escapeHtml(l.notes)}</div>` : ''}

      if (!confirm(`Delete ${c.name || 'this contact'}?`)) return;

      saveData(); render();

  function renderSequenceTracker(c) {
    const { done, next, suggestedDate } = sequenceProgress(c);
    const steps = SEQUENCE_TEMPLATE.map((s, i) => {
      const isDone = i < done;
      const isNext = i === done;
      return `
        <div style="display:flex; align-items:center; gap:8px; padding:3px 0;">
          <span style="width:18px; height:18px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;
            background:${isDone ? 'var(--green)' : isNext ? 'var(--amber)' : 'var(--surface-3)'}; color:${isDone || isNext ? '#fff' : 'var(--text-dim)'};">
            ${isDone ? '✓' : s.step}
          </span>
          <span style="font-size:12.5px; color:${isDone ? 'var(--text-muted)' : isNext ? 'var(--text)' : 'var(--text-dim)'}; font-weight:${isNext ? '700' : '400'};">
            ${s.label}
          </span>
        </div>
      `;
    }).join('');
    let suggestion = '';
    if (next) {
      suggestion = `
        <div style="margin-top:8px; padding:8px 10px; background:var(--amber-dim); border-radius:8px; font-size:12px;">
          Next: <b>${next.label}</b> — suggested <b class="mono">${fmtDate(suggestedDate)}</b>
          <button class="cb-btn cb-btn-ghost cb-seq-apply-date" data-date="${suggestedDate}" style="display:block; margin-top:4px; padding:3px 6px; font-size:11px; color:var(--amber);">Apply Date</button>
        </div>
      `;
    }
    return `<div>${steps}</div>${suggestion}`;
  }

  $('#cb-search-input').addEventListener('input', (e) => {
    state.search = e.target.value;
    render();
  });

  // ---------- Export ----------
  function exportContacts(list, filenamePrefix = 'callboard-export') {
    if (!list.length) { toast('No contacts to export'); return; }
    openExportChoiceModal(list, filenamePrefix);
  }

  function openExportChoiceModal(list, filenamePrefix) {
    const overlay = $('#cb-modal-overlay');
    const modal = $('#cb-modal');
    modal.innerHTML = `
      <h3>Export Leads (${list.length})</h3>
      <div class="cb-modal-sub">Choose your preferred export file format:</div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
        <button class="cb-btn cb-btn-primary" id="cb-export-excel" style="justify-content:center;">📊 Export as Excel (.xlsx)</button>
        <button class="cb-btn" id="cb-export-csv" style="justify-content:center;">📄 Export as CSV (.csv)</button>
        <button class="cb-btn" id="cb-export-json" style="justify-content:center;">📦 Export as JSON (.json)</button>
      </div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="cb-btn cb-btn-ghost" id="cb-export-cancel">Cancel</button>
      </div>
    `;
    overlay.classList.add('open');

    const formattedRows = list.map(c => ({
      Name: c.name || '', Company: c.company || '', Website: c.website || '',
      Niche: c.niche || '', Phone: c.phone || '', Email: c.email || '',
      Country: c.country || '', State: c.state || '', Address: c.address || '',
      Tags: (c.tags || []).join(', '), Status: STATUS_META[c.status] ? STATUS_META[c.status].label : c.status,
      NextFollowUp: c.nextFollowUp || '', DateAdded: c.createdAt || '', Notes: c.notes || ''
    }));

    $('#cb-export-excel').onclick = () => {
      const ws = XLSX.utils.json_to_sheet(formattedRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Leads");
      XLSX.writeFile(wb, `${filenamePrefix}.xlsx`);
      closeModal();
      toast('Exported Excel file');
    };

    $('#cb-export-csv').onclick = () => {
      const csv = Papa.unparse(formattedRows);
      downloadFile(csv, `${filenamePrefix}.csv`, 'text/csv');
      closeModal();
      toast('Exported CSV file');
    };

    $('#cb-export-json').onclick = () => {
      const json = JSON.stringify(list, null, 2);
      downloadFile(json, `${filenamePrefix}.json`, 'application/json');
      closeModal();
      toast('Exported JSON file');
    };

    $('#cb-export-cancel').onclick = closeModal;
  }

  function downloadFile(content, fileName, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName; a.click();
    URL.revokeObjectURL(url);
  }

  $('#cb-export-btn').addEventListener('click', () => exportContacts(state.contacts));

  // ---------- Import ----------
  const FIELD_TARGETS = [
    { key: 'name', label: 'Name', patterns: ['name', 'contact', 'full name', 'client', 'lead'] },
    { key: 'company', label: 'Company', patterns: ['company', 'business', 'org', 'organization'] },
    { key: 'website', label: 'Website', patterns: ['website', 'site', 'url', 'web', 'domain'] },
    { key: 'niche', label: 'Niche', patterns: ['niche', 'industry', 'category', 'sector', 'vertical'] },
    { key: 'phone', label: 'Phone', patterns: ['phone', 'mobile', 'tel', 'number', 'cell'] },
    { key: 'email', label: 'Email', patterns: ['email', 'mail'] },
    { key: 'country', label: 'Country', patterns: ['country', 'nation', 'location'] },
    { key: 'state', label: 'State', patterns: ['state', 'province', 'region'] },
    { key: 'address', label: 'Address', patterns: ['address', 'street', 'city'] },
    { key: 'tags', label: 'Tags', patterns: ['tags', 'tag', 'labels', 'keywords'] },
    { key: 'notes', label: 'Notes', patterns: ['notes', 'note', 'comment', 'description'] },
  ];

  function guessMapping(headers) {
    const mapping = {};
    FIELD_TARGETS.forEach(f => {
      const hit = headers.find(h => f.patterns.some(p => h.toLowerCase().trim() === p || h.toLowerCase().trim().includes(p)));
      mapping[f.key] = hit || '';
    });
    return mapping;
  }

  function openImportModal() {
    const overlay = $('#cb-modal-overlay');
    const modal = $('#cb-modal');
    modal.innerHTML = `
      <h3>Import Leads</h3>
      <div class="cb-modal-sub">Upload an Excel (.xlsx, .xls), CSV (.csv), or JSON file of your leads.</div>
      <div id="cb-drop-zone">
        <input type="file" accept=".csv,.xlsx,.xls,.json" id="cb-file-input" style="display:none;" />
        Drop file here (.csv, .xlsx, .xls, .json), or click to browse
      </div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="cb-btn cb-btn-ghost" id="cb-modal-cancel">Cancel</button>
      </div>
    `;
    overlay.classList.add('open');
    const dz = $('#cb-drop-zone');
    const fileInput = $('#cb-file-input');
    dz.onclick = () => fileInput.click();
    dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('dragover'); };
    dz.ondragleave = () => dz.classList.remove('dragover');
    dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files.length) parseImportFile(e.dataTransfer.files[0]); };
    fileInput.onchange = (e) => { if (e.target.files.length) parseImportFile(e.target.files[0]); };
    $('#cb-modal-cancel').onclick = closeModal;
  }

  function parseImportFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'json') {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed)) processImportRows(parsed);
          else toast('JSON file must contain an array of objects');
        } catch(err) { toast('Invalid JSON file'); }
      };
      reader.readAsText(file);
    } else if (ext === 'xlsx' || ext === 'xls') {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.SheetNames[0];
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
          if (!rows.length) { toast('Excel sheet appears empty'); return; }
          const headers = Object.keys(rows[0]);
          state.pendingImport = { rows, headers };
          renderMappingStep();
        } catch(err) { toast('Error parsing Excel file'); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: (results) => {
          if (!results.data.length) { toast('CSV appears empty'); return; }
          state.pendingImport = { rows: results.data, headers: results.meta.fields || [] };
          renderMappingStep();
        },
        error: () => toast('Could not parse CSV')
      });
    }
  }

  function renderMappingStep() {
    const { rows, headers } = state.pendingImport;
    const mapping = guessMapping(headers);
    const modal = $('#cb-modal');
    modal.innerHTML = `
      <h3>Map Columns</h3>
      <div class="cb-modal-sub">${rows.length} rows found. Match your file columns to Callboard lead fields:</div>
      <div id="cb-mapping-rows">
        ${FIELD_TARGETS.map(f => `
          <div class="cb-map-row">
            <label>${f.label}${f.key === 'name' ? ' *' : ''}</label>
            <select data-field="${f.key}">
              <option value="">— Skip —</option>
              ${headers.map(h => `<option value="${escapeHtml(h)}" ${mapping[f.key] === h ? 'selected' : ''}>${escapeHtml(h)}</option>`).join('')}
            </select>
          </div>
        `).join('')}
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
        <button class="cb-btn cb-btn-ghost" id="cb-modal-cancel">Cancel</button>
        <button class="cb-btn cb-btn-primary" id="cb-modal-confirm">Next (${rows.length} Leads)</button>
      </div>
    `;
    $('#cb-modal-cancel').onclick = closeModal;
    $('#cb-modal-confirm').onclick = () => {
      const finalMapping = {};
      $$('#cb-mapping-rows select').forEach(sel => { finalMapping[sel.dataset.field] = sel.value; });
      if (!finalMapping.name) { toast('Please map a Name column'); return; }

      const formatted = rows.map(r => {
        const tagRaw = finalMapping.tags ? r[finalMapping.tags] : '';
        const tagsArr = Array.isArray(tagRaw) ? tagRaw : (typeof tagRaw === 'string' ? tagRaw.split(',').map(t=>t.trim()).filter(Boolean) : []);
        return {
          id: uid(),
          name: (r[finalMapping.name] || '').trim(),
          company: finalMapping.company ? (r[finalMapping.company] || '').trim() : '',
          website: finalMapping.website ? (r[finalMapping.website] || '').trim() : '',
          niche: finalMapping.niche ? (r[finalMapping.niche] || '').trim() || 'Uncategorized' : 'Uncategorized',
          phone: finalMapping.phone ? (r[finalMapping.phone] || '').trim() : '',
          email: finalMapping.email ? (r[finalMapping.email] || '').trim() : '',
          country: finalMapping.country ? (r[finalMapping.country] || '').trim() : '',
          state: finalMapping.state ? (r[finalMapping.state] || '').trim() : '',
          address: finalMapping.address ? (r[finalMapping.address] || '').trim() : '',
          tags: tagsArr,
          notes: finalMapping.notes ? (r[finalMapping.notes] || '').trim() : '',
          status: 'new',
          nextFollowUp: null,
          calls: [],
          createdAt: new Date().toISOString(),
        };
      }).filter(c => c.name);

      processImportRows(formatted);
    };
  }

  function processImportRows(newRows) {
    const dupes = checkDuplicates(newRows);
    if (dupes.length > 0) {
      state.duplicateLeads = { dupes, newRows };
      renderDuplicateResolutionModal();
    } else {
      finalizeImport(newRows);
    }
  }

  function renderDuplicateResolutionModal() {
    const { dupes, newRows } = state.duplicateLeads;
    const modal = $('#cb-modal');
    modal.innerHTML = `
      <h3>Duplicate Leads Detected (${dupes.length})</h3>
      <div class="cb-modal-sub">We found existing leads matching your import list by phone, email, or company name:</div>

      <div style="max-height: 240px; overflow-y: auto; margin-bottom: 14px;">
        ${dupes.slice(0, 10).map(d => `
          <div class="cb-dupe-item">
            <div>Importing: <b>${escapeHtml(d.newRow.name)}</b> (${escapeHtml(d.newRow.phone || d.newRow.email || d.newRow.company)})</div>
            <div style="color:var(--amber); font-size:11.5px; margin-top:2px;">⚠️ ${escapeHtml(d.reason)}</div>
          </div>
        `).join('')}
        ${dupes.length > 10 ? `<div style="text-align:center; color:var(--text-dim); font-size:12px;">...and ${dupes.length - 10} more duplicates.</div>` : ''}
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="cb-btn cb-btn-primary" id="cb-dupe-skip">Skip Duplicates (Import Only ${newRows.length - dupes.length} New)</button>
        <button class="cb-btn" id="cb-dupe-merge">Merge / Update Existing Details</button>
        <button class="cb-btn" id="cb-dupe-keep">Import All Anyway (Keep Both)</button>
      </div>
    `;

    const dupeNewIds = new Set(dupes.map(d => d.newRow.id));

    $('#cb-dupe-skip').onclick = () => {
      const cleanRows = newRows.filter(r => !dupeNewIds.has(r.id));
      finalizeImport(cleanRows);
    };

    $('#cb-dupe-merge').onclick = () => {
      dupes.forEach(d => {
        const ex = d.existingRow;
        const nw = d.newRow;
        if (nw.company) ex.company = nw.company;
        if (nw.website) ex.website = nw.website;
        if (nw.phone) ex.phone = nw.phone;
        if (nw.email) ex.email = nw.email;
        if (nw.country) ex.country = nw.country;
        if (nw.state) ex.state = nw.state;
        if (nw.niche && nw.niche !== 'Uncategorized') ex.niche = nw.niche;
      });
      const cleanRows = newRows.filter(r => !dupeNewIds.has(r.id));
      finalizeImport(cleanRows, `Merged ${dupes.length} duplicates and added ${cleanRows.length} new leads`);
    };

    $('#cb-dupe-keep').onclick = () => {
      finalizeImport(newRows);
    };
  }

  function finalizeImport(importedRows, customMsg) {
    state.contacts = state.contacts.concat(importedRows);
    saveData();
    addActivity('Imported leads', `${importedRows.length} leads added`);
    closeModal();
    toast(customMsg || `Imported ${importedRows.length} leads`);
    render();
  }

  function closeModal() {
    $('#cb-modal-overlay').classList.remove('open');
    state.pendingImport = null;
    state.duplicateLeads = null;
  }

  $('#cb-import-btn').addEventListener('click', openImportModal);
  $('#cb-modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'cb-modal-overlay') closeModal(); });

  // ---------- Supabase Config Modal ----------
  function openDbSettingsModal() {
    const overlay = $('#cb-db-overlay');
    const modal = $('#cb-db-modal');
    modal.innerHTML = `
      <h3>Supabase Database Configuration</h3>
      <div class="cb-modal-sub">Connect your Supabase PostgreSQL database to sync contacts across Render and GitHub deployments.</div>
      <div class="cb-login-field">
        <label>Supabase Project URL</label>
        <input id="cb-db-url-input" placeholder="https://xyz.supabase.co" value="${escapeHtml(state.supabaseUrl)}" />
      </div>
      <div class="cb-login-field">
        <label>Supabase Anon (Public) Key</label>
        <input id="cb-db-key-input" type="password" placeholder="eyJhbGciOi..." value="${escapeHtml(state.supabaseKey)}" />
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
        <button class="cb-btn cb-btn-ghost" id="cb-db-clear" style="color:var(--red);">Clear Credentials</button>
        <div style="display:flex; gap:8px;">
          <button class="cb-btn cb-btn-ghost" id="cb-db-cancel">Cancel</button>
          <button class="cb-btn cb-btn-primary" id="cb-db-save">Save & Connect</button>
        </div>
      </div>
    `;
    overlay.classList.add('open');

    $('#cb-db-cancel').onclick = () => overlay.classList.remove('open');
    $('#cb-db-clear').onclick = () => {
      saveSupabaseConfig('', '');
      overlay.classList.remove('open');
      toast('Database config cleared. Running in local mode.');
      render();
    };
    $('#cb-db-save').onclick = () => {
      const url = $('#cb-db-url-input').value.trim();
      const key = $('#cb-db-key-input').value.trim();
      saveSupabaseConfig(url, key);
      overlay.classList.remove('open');
      toast('Connecting to Supabase...');
      render();
    };
  }

  $('#cb-db-status-badge').addEventListener('click', openDbSettingsModal);
  $('#cb-db-overlay').addEventListener('click', (e) => { if (e.target.id === 'cb-db-overlay') $('#cb-db-overlay').classList.remove('open'); });

  // ---------- Admin Panel ----------
  function openAdminPanel() { $('#cb-admin-overlay').classList.add('open'); renderAdminPanel(); }
  function closeAdminPanel() { $('#cb-admin-overlay').classList.remove('open'); }
  function renderAdminPanel() {
    const overlay = $('#cb-admin-overlay');
    if (!overlay.classList.contains('open')) return;
    const modal = $('#cb-admin-modal');
    const tab = state.adminTab;
    modal.innerHTML = `
      <h3 style="margin:0 0 4px;">Admin Panel</h3>
      <div class="cb-modal-sub">Manage workspace team members and view activity logs.</div>
      <div class="cb-admin-tabs">
        <div class="cb-admin-tab ${tab === 'team' ? 'active' : ''}" data-tab="team">Team (${state.users.length})</div>
        <div class="cb-admin-tab ${tab === 'activity' ? 'active' : ''}" data-tab="activity">Activity Log</div>
      </div>
      <div id="cb-admin-tab-body"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="cb-btn cb-btn-ghost" id="cb-admin-close">Close</button>
      </div>
    `;
    $$('.cb-admin-tab').forEach(t => t.addEventListener('click', () => { state.adminTab = t.dataset.tab; renderAdminPanel(); }));
    $('#cb-admin-close').addEventListener('click', closeAdminPanel);
    const body = $('#cb-admin-tab-body');
    if (tab === 'team') {
      body.innerHTML = `
        <table class="cb-admin-table">
          <thead><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${state.users.map(u => `
              <tr>
                <td>${escapeHtml(u.name)}${u.id === state.currentUser.id ? ' (you)' : ''}</td>
                <td><span class="cb-role-pill ${u.role === 'caller' ? 'caller' : ''}">${u.role}</span></td>
                <td>${u.active ? 'Active' : '<span style="color:var(--red);">Deactivated</span>'}</td>
                <td style="text-align:right;">
                  ${u.id !== state.currentUser.id ? `
                    <button class="cb-inline-btn" data-action="role" data-id="${u.id}">${u.role === 'admin' ? 'Make Caller' : 'Make Admin'}</button>
                    <button class="cb-inline-btn" data-action="toggle-active" data-id="${u.id}">${u.active ? 'Deactivate' : 'Reactivate'}</button>
                  ` : '—'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      body.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => handleAdminUserAction(btn.dataset.action, btn.dataset.id)));
    } else {
      body.innerHTML = state.activityLog.length ? state.activityLog.map(a => `
        <div class="cb-activity-item">
          <div><b>${escapeHtml(a.userName)}</b> — ${escapeHtml(a.action)}${a.detail ? ': ' + escapeHtml(a.detail) : ''}</div>
          <div class="cb-act-meta">${fmtDateTime(a.ts)}</div>
        </div>
      `).join('') : `<div style="color:var(--text-dim); padding:10px 0;">No activity logged yet.</div>`;
    }
  }

  async function handleAdminUserAction(action, userId) {
    const u = state.users.find(x => x.id === userId);
    if (!u) return;
    if (action === 'role') { u.role = u.role === 'admin' ? 'caller' : 'admin'; await saveUsers(); toast(`${u.name} is now ${u.role}`); }
    else if (action === 'toggle-active') { u.active = !u.active; await saveUsers(); toast(`${u.name} ${u.active ? 'reactivated' : 'deactivated'}`); }
    renderAdminPanel();
  }

  $('#cb-admin-btn').addEventListener('click', openAdminPanel);
  $('#cb-admin-overlay').addEventListener('click', (e) => { if (e.target.id === 'cb-admin-overlay') closeAdminPanel(); });

  // ---------- Init ----------
  async function init() {
    loadSupabaseConfig();
    await loadUsers();
    await loadActivityLog();
    const hasSession = await checkSession();
    if (hasSession) {
      await initSupabaseClient();
    } else {
      render();
    }
  }
  init();
})();
</script>
</body>
</html>
